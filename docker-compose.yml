name: bun-stand

services:
  migrate:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - data:/data
    environment:
      DATABASE_PATH: /data/app.db
    command: >-
      sh -c "bun install --frozen-lockfile --ignore-scripts &&
      bun run db:migrate:runtime &&
      { [ -f /data/.seeded ] || { bun run db:seed && touch /data/.seeded; }; } &&
      chown -R 65532:65532 /data"

  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - data:/data
    environment:
      DATABASE_PATH: /data/app.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  data: